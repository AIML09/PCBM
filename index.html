function escapeHTML(text) {
    return String(text)

        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function filterChapters() {

    const input = document.getElementById("chapterSearch");

    if (!input) return;

    const search = input.value.toLowerCase().trim();

    document.querySelectorAll(".chapter-card").forEach(card => {

        const name = card.dataset.name || "";

        card.style.display =
            name.includes(search) ? "block" : "none";
    });
}

function showMCQ() {

        </div>

}


/* =========================================================
   ORGANIC MCQ
========================================================= */

function renderOrganicMCQ(index) {

    if (index >= organicMCQs.length) {

        document.getElementById("app").innerHTML = `

            <div class="content-box">

                <h2>🎉 MCQ Practice Complete!</h2>

                <p>
                    You completed all
                    ${organicMCQs.length}
                    Organic Chemistry questions.
                </p>

                <button onclick="renderOrganicMCQ(0)">
                    🔄 Start Again
                </button>

            </div>

            ${backToChapter()}
        `;

        return;
    }

    const question = organicMCQs[index];

    document.getElementById("app").innerHTML = `

        <div class="question">

            <h2>
                ❓ GOC MCQ
                ${index + 1}/${organicMCQs.length}
            </h2>

            <h3>${escapeHTML(question.q)}</h3>

            ${question.options.map((option, i) => `
                <button
                    class="option"
                    onclick="answerOrganicMCQ(
                        this,
                        ${i},
                        ${question.answer},
                        ${index}
                    )">

                    ${String.fromCharCode(65 + i)}.
                    ${escapeHTML(option)}

                </button>
            `).join("")}

            <div id="answerBox"></div>

        </div>

        ${backToChapter()}
    `;
}


/* =========================================================
   ORGANIC MCQ ANSWER
========================================================= */

function answerOrganicMCQ(button, selected, correct, index) {

    const buttons =
        button.parentElement.querySelectorAll(".option");

    buttons.forEach(btn => {
        btn.disabled = true;
    });

    if (selected === correct) {

        button.classList.add("correct");

        document.getElementById("answerBox").innerHTML = `
            <div class="answer-box">

                <strong>✅ Correct!</strong>

                <p>
                    ${escapeHTML(organicMCQs[index].explanation)}
                </p>

                <button onclick="renderOrganicMCQ(${index + 1})">
                    Next Question →
                </button>

            </div>
        `;

    } else {

        button.classList.add("wrong");
        buttons[correct].classList.add("correct");

        document.getElementById("answerBox").innerHTML = `
            <div class="answer-box">

                <strong>❌ Incorrect</strong>

                <p>
                    Correct answer:
                    <strong>
                        ${escapeHTML(buttons[correct].innerText)}
                    </strong>
                </p>

                <p>
                    ${escapeHTML(organicMCQs[index].explanation)}
                </p>

                <button onclick="renderOrganicMCQ(${index + 1})">
                    Next Question →
                </button>

            </div>
        `;
    }
}

                "20 m/s",

                "30 m/s"
            ],
            answer: 1
        };

    }

    if (subject === "Chemistry") {

        return {
            q: "What is the SI unit of amount of substance?",
            options: [
                "Gram",
                "Kilogram",
                "Mole",
                "Litre"
            ],
            answer: 2
        };

    }

    if (subject === "Biology") {

        return {
            q: "The basic structural and functional unit of life is:",
            options: [
                "Tissue",
                "Cell",
                "Organ",
                "Organ system"
            ],
            answer: 1
        };

    }

    return {
        q: "What is the derivative of x²?",
        options: [
            "x",
            "2x",
            "x²",
            "2"
        ],
        answer: 1
    };
}


/* =========================================================
   GENERAL MCQ CHECK
========================================================= */

function checkMCQ(button, selected, correct) {

    const question =
        button.closest(".question");

    const buttons =
        question.querySelectorAll(".option");

    buttons.forEach(btn => {
        btn.disabled = true;
    });

    const answerBox =
        question.querySelector("#answerBox");

    if (selected === correct) {

        button.classList.add("correct");

        answerBox.innerHTML = `
            <div class="answer-box">
                <strong>✅ Correct!</strong>
                <p>Excellent. You selected the correct answer.</p>
            </div>
        `;

    } else {

        button.classList.add("wrong");
        buttons[correct].classList.add("correct");

        answerBox.innerHTML = `
            <div class="answer-box">

                <strong>❌ Incorrect</strong>

                <p>
                    Correct answer:
                    <strong>
                        ${escapeHTML(buttons[correct].innerText)}
                    </strong>
                </p>

            </div>
        `;
    }
}

function testAnswer(button, correct) {

    const question =
        button.closest(".question");

    const options =
        question.querySelectorAll(".option");

    options.forEach(btn => {
        btn.disabled = true;
    });

    if (correct) {

        button.classList.add("correct");

        question.querySelector("#testResult").innerHTML = `
            <div class="answer-box">

        `;

    } else {

        button.classList.add("wrong");

        question.querySelector("#testResult").innerHTML = `
            <div class="answer-box">
                ❌ Incorrect. Review the chapter concepts.
            </div>
        `;
    }
}
