theory:`
<h3>1. What is Organic Chemistry?</h3> <p> Organic chemistry is the branch of chemistry that deals primarily with carbon compounds. Carbon forms an enormous variety of compounds because of its tetravalency, catenation and ability to form multiple bonds. </p> <h3>2. Tetravalency of Carbon</h3> <p> Carbon has four valence electrons and generally forms four covalent bonds. This allows carbon to form stable compounds with carbon, hydrogen, oxygen, nitrogen, sulfur and halogens. </p> <h3>3. Catenation</h3> <p> Catenation is the ability of an element to form bonds with atoms of the same element. Carbon shows exceptional catenation and can form straight chains, branched chains and rings. </p> <h3>4. Classification of Organic Compounds</h3> <ul> <li><strong>Acyclic:</strong> Open-chain compounds.</li> <li><strong>Cyclic:</strong> Compounds containing rings.</li> <li><strong>Carbocyclic:</strong> Rings containing carbon atoms.</li> <li><strong>Heterocyclic:</strong> Rings containing carbon and other atoms.</li> <li><strong>Aromatic:</strong> Compounds containing aromatic systems.</li> <li><strong>Aliphatic:</strong> Non-aromatic compounds.</li> </ul> <h3>5. Functional Groups</h3> <p> A functional group is an atom or group of atoms that determines the characteristic chemical reactions of an organic compound. </p> <table> <tr> <th>Functional Group</th> <th>Class</th> <th>Example</th> </tr> <tr> <td>–OH</td> <td>Alcohol</td> <td>CH₃OH</td> </tr> <tr> <td>–CHO</td> <td>Aldehyde</td> <td>CH₃CHO</td> </tr> <tr> <td>&gt;C=O</td> <td>Ketone</td> <td>CH₃COCH₃</td> </tr> <tr> <td>–COOH</td> <td>Carboxylic acid</td> <td>CH₃COOH</td> </tr> <tr> <td>–NH₂</td> <td>Amine</td> <td>CH₃NH₂</td> </tr> <tr> <td>–X</td> <td>Halo compound</td> <td>CH₃Cl</td> </tr> </table> <h3>6. Homologous Series</h3> <p> A homologous series consists of compounds having the same functional group and general formula. Consecutive members differ by one –CH₂– unit. </p> <div class="formula"> Difference between consecutive homologues = CH₂ = 14 u </div> <h3>7. IUPAC Nomenclature</h3> <p> IUPAC nomenclature provides systematic names for organic compounds. The basic process is: </p> <ol> <li>Choose the appropriate parent chain.</li> <li>Identify the principal functional group.</li> <li>Number the parent chain correctly.</li> <li>Identify substituents.</li> <li>Assign substituent positions.</li> <li>Arrange substituents alphabetically where applicable.</li> <li>Use the correct suffix for the principal functional group.</li> </ol> <h3>8. Isomerism</h3> <p> Isomers have the same molecular formula but different arrangements or spatial orientations of atoms. </p> <h4>Structural Isomerism</h4> <ul> <li>Chain isomerism</li> <li>Position isomerism</li> <li>Functional group isomerism</li> <li>Metamerism</li> <li>Tautomerism</li> </ul> <h4>Stereoisomerism</h4> <ul> <li>Geometrical isomerism</li> <li>Optical isomerism</li> </ul> <h3>9. Electrophiles</h3> <p> An electrophile is an electron-deficient species that accepts an electron pair from another species. </p> <div class="formula"> Electrophile = electron-pair acceptor </div> <p> Examples include H⁺ and positively polarized carbon centers. </p> <h3>10. Nucleophiles</h3> <p> A nucleophile is an electron-rich species that donates an electron pair. </p> <div class="formula"> Nucleophile = electron-pair donor </div> <p> Examples include OH⁻, CN⁻, NH₃ and H₂O. </p> <h3>11. Inductive Effect</h3> <p> The inductive effect is the permanent displacement or polarization of sigma electrons caused by electronegativity differences. </p> <ul> <li><strong>+I effect:</strong> Electron-releasing effect.</li> <li><strong>–I effect:</strong> Electron-withdrawing effect.</li> </ul> <h3>12. Resonance</h3> <p> When a molecule can be represented by two or more valid canonical structures that differ only in electron arrangement, resonance is involved. The real structure is a resonance hybrid. </p> <h3>13. Hyperconjugation</h3> <p> Hyperconjugation is delocalization involving a sigma bond, commonly a C–H bond adjacent to a π system or electron-deficient center. It contributes to the stability of carbocations and substituted alkenes. </p> <h3>14. Carbocations</h3> <p> A carbocation is a positively charged carbon species. For simple alkyl carbocations, stability generally follows: </p> <div class="formula"> 3° &gt; 2° &gt; 1° &gt; CH₃⁺ </div> <p> Resonance can significantly alter this simple order. For example, allylic and benzylic carbocations receive resonance stabilization. </p> <h3>15. Carbanions</h3> <p> A carbanion is a negatively charged carbon species. For simple alkyl carbanions: </p> <div class="formula"> CH₃⁻ &gt; 1° &gt; 2° &gt; 3° </div> <p> Electron-withdrawing groups and resonance can stabilize carbanions. </p> <h3>16. Free Radicals</h3> <p> Free radicals contain an unpaired electron. Simple alkyl radical stability generally follows: </p> <div class="formula"> 3° &gt; 2° &gt; 1° &gt; CH₃• </div> <h3>17. Types of Organic Reactions</h3> <ul> <li><strong>Substitution:</strong> One atom/group replaces another.</li> <li><strong>Addition:</strong> Species add across a multiple bond.</li> <li><strong>Elimination:</strong> Groups are removed and a multiple bond may form.</li> <li><strong>Rearrangement:</strong> Atoms/groups reorganize within a molecule.</li> <li><strong>Oxidation:</strong> Often increase in C–O/C–X bonds or decrease in C–H bonds.</li> <li><strong>Reduction:</strong> Often increase in C–H bonds or decrease in C–O/C–X bonds.</li> </ul> <h3>18. Bond Fission</h3> <h4>Homolytic Fission</h4> <p> In homolytic cleavage, each bonded atom receives one electron from the bonding pair, producing free radicals. </p> <div class="formula"> A–B → A• + B• </div> <h4>Heterolytic Fission</h4> <p> In heterolytic cleavage, both bonding electrons go to one atom, producing ions. </p> <div class="formula"> A–B → A⁺ + B⁻ </div>

        ${material.examples
            .map((example,index)=>`

                <div class="example">

                    <h3>
                        Example ${index+1}
                    </h3>

                    <p>
                        <strong>Question:</strong>
                        ${example.q}
                    </p>

                    <p>
                        <strong>Solution:</strong>
                        ${example.a}
                    </p>

                </div>

            `)
            .join("")}

    </div>

    ${backToChapter()}

`;

}

/* =========================================================
MCQs
========================================================= */

function showMCQ(){

const material =
    studyMaterial[currentChapter];

if(!material){

    showComingSoon();

    return;

}

currentMCQIndex = 0;

renderMCQ();

}

function renderMCQ(){

const material =
    studyMaterial[currentChapter];

const question =
    material.mcqs[currentMCQIndex];

const total =
    material.mcqs.length;

const progress =
    (currentMCQIndex / total) * 100;

document.getElementById("app").innerHTML = `

    <div class="question">

        <h2>
            ❓ ${currentChapter} — MCQ Practice
        </h2>

        <div class="progress">

            <div
                class="progress-bar"
                style="width:${progress}%">
            </div>

        </div>

        <p>
            Question ${currentMCQIndex+1}
            of ${total}
        </p>

        <h3>
            ${question.q}
        </h3>

        ${question.options.map((option,index)=>`

            <button
                class="option"
                onclick="
                    checkMCQ(
                        this,
                        ${index},
                        ${question.answer}
                    )
                ">

                ${String.fromCharCode(65+index)}.
                ${option}

            </button>

        `).join("")}

        <div id="answerBox"></div>

    </div>

    ${backToChapter()}

`;

}

/* =========================================================
CHECK MCQ
========================================================= */

function checkMCQ(button,selected,correct){

const material =
    studyMaterial[currentChapter];

const question =
    material.mcqs[currentMCQIndex];

const buttons =
    document.querySelectorAll(".option");

buttons.forEach(b=>{
    b.disabled=true;
});

if(selected === correct){

    button.classList.add("correct");

    document.getElementById("answerBox").innerHTML = `

        <div class="answer-box">

            <strong>✅ Correct!</strong>

            <p>
                ${question.explanation}
            </p>

            ${
                currentMCQIndex <
                material.mcqs.length-1
                ?
                `
                <button onclick="nextMCQ()">
                    Next Question →
                </button>
                `
                :
                `
                <p>
                    🎉 You completed all MCQs!
                </p>
                `
            }

        </div>

    `;

}
else{

    button.classList.add("wrong");

    buttons[correct]
    .classList.add("correct");

    document.getElementById("answerBox").innerHTML = `

        <div class="answer-box">

            <strong>❌ Incorrect</strong>

            <p>
                Correct answer:
                <strong>
                    ${buttons[correct].innerText}
                </strong>
            </p>

            <p>
                ${question.explanation}
            </p>

            ${
                currentMCQIndex <
                material.mcqs.length-1
                ?
                `
                <button onclick="nextMCQ()">
                    Next Question →
                </button>
                `
                :
                `
                <p>
                    🎉 You completed all MCQs!
                </p>
                `
            }

        </div>

    `;

}

}

function nextMCQ(){

currentMCQIndex++;

renderMCQ();

}

/* =========================================================
CONCEPT TRAPS
========================================================= */

function showConceptTrap(){

const material =
    studyMaterial[currentChapter];

if(!material){

    showComingSoon();

    return;

}

document.getElementById("app").innerHTML = `

    <div class="content-box">

        <h2>

            </p>

        </div>

    </div>

}

/* =========================================================
CHAPTER TEST
========================================================= */

function showTest(){

const material =
    studyMaterial[currentChapter];

if(!material){

    showComingSoon();

    return;

}

testQuestions =
    [...material.mcqs]
    .sort(()=>Math.random()-0.5)
    .slice(0,5);

testIndex = 0;
testScore = 0;

renderTest();

}

function renderTest(){

const question =
    testQuestions[testIndex];

document.getElementById("app").innerHTML = `

    <div class="question">

        <h2>
            🎯 ${currentChapter} — Chapter Test
        </h2>

        <p>
            Question ${testIndex+1}
            of ${testQuestions.length}
        </p>

        <h3>
            ${question.q}
        </h3>

        ${question.options.map((option,index)=>`

            <button
                class="option"
                onclick="
                    checkTest(
                        this,
                        ${index},
                        ${question.answer}
                    )
                ">

                ${String.fromCharCode(65+index)}.
                ${option}

            </button>

        `).join("")}

        <div id="testResult"></div>

    </div>

    ${backToChapter()}

`;

}

function checkTest(button,selected,correct){

const buttons =
    document.querySelectorAll(".option");

buttons.forEach(b=>{
    b.disabled=true;
});

if(selected === correct){

    testScore++;

    button.classList.add("correct");

    document.getElementById("testResult").innerHTML = `

        <div class="answer-box">

            <strong>✅ Correct!</strong>

            <br><br>

            <button onclick="nextTestQuestion()">
                Next →
            </button>

        </div>

    `;

}
else{

    button.classList.add("wrong");

    buttons[correct]
    .classList.add("correct");

    document.getElementById("testResult").innerHTML = `

        <div class="answer-box">

            <strong>❌ Incorrect</strong>

            <br><br>

            <button onclick="nextTestQuestion()">
                Next →
            </button>

        </div>

    `;

}

}

function nextTestQuestion(){

testIndex++;

if(testIndex >= testQuestions.length){

    showTestResult();

}
else{

    renderTest();

}

}

function showTestResult(){

const total =
    testQuestions.length;

const percentage =
    Math.round((testScore/total)*100);

let message;

if(percentage >= 80){

    message =
        "🔥 Excellent! You have a strong understanding.";

}
else if(percentage >= 60){

    message =
        "👍 Good job! Revise the concepts you missed.";

}
else{

    message =
        "📚 Revise the theory and try the test again.";

}

document.getElementById("app").innerHTML = `

    <div class="content-box"
         style="text-align:center;">

        <h2>
            🎉 Test Completed
        </h2>

        <h1>
            ${testScore} / ${total}
        </h1>

        <h2>
            ${percentage}%
        </h2>

        <p>
            ${message}
        </p>

        <button onclick="showTest()">
            🔄 Retake Test
        </button>

    </div>

    ${backToChapter()}

`;

}
