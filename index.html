<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PCBM V2 - NEET Study Portal</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #111827;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }

        .subtitle {
            opacity: .75;
        }

        #search {
            margin-left: auto;
            width: min(420px, 90vw);
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #374151;
            outline: none;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 25px 18px;
        }

        .home-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .home-title h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .subjects {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .subject {
            border: none;
            border-radius: 14px;
            padding: 22px;
            background: white;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: .2s;
        }

        .subject:hover {
            transform: translateY(-3px);
        }

        .chapter-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .chapter {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: .2s;
        }

        .chapter:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .chapter h3 {
            margin-top: 0;
        }

        .topic-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .topic {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 17px;
            cursor: pointer;
        }

        .topic:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,.08);
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .tabs button,
        .back-button {
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
        }

        .tabs button:hover,
        .back-button:hover {
            background: #eef2ff;
        }

        .content {
            background: white;
            border-radius: 14px;
            padding: 25px;
            line-height: 1.7;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
        }

        .formula {
            background: #f3f4f6;
            border-left: 5px solid #374151;
            padding: 14px;
            margin: 12px 0;
            border-radius: 6px;
        }

        .formula-text {
            font-family: "Courier New", monospace;
            font-size: 18px;
            margin-top: 7px;
        }

        .example {
            background: #f8fafc;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
        }

        .derivation {
            background: #fafafa;
            border-left: 4px solid #6b7280;
            padding: 15px;
            margin: 10px 0;
        }

        .mcq {
            margin-bottom: 28px;
        }

        .option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 11px;
            margin: 7px 0;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 7px;
            cursor: pointer;
        }

        .option:hover {
            background: #f3f4f6;
        }

        .answer {
            margin-top: 10px;
            padding: 12px;
            border-radius: 7px;
            background: #f3f4f6;
        }

        .visual {
            max-width: 100%;
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: white;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .loading {
            padding: 30px;
            text-align: center;
            font-size: 18px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            .subtitle {
                display: none;
            }

            #search {
                margin-left: 0;
                width: 100%;
            }

            .home-title h1 {
                font-size: 27px;
            }

            .content {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        📚 PCBM V2
    </div>

    <div class="subtitle">
        NEET Complete Study Portal
    </div>

    <input
        id="search"
        type="search"
        placeholder="Search Physics / Chemistry / Biology / Maths..."
    >

</header>


<main class="container">

    <div id="app">

        <div class="loading">
            Loading PCBM V2...
        </div>

    </div>

</main>


<footer>
    PCBM V2 • NEET Study Material
</footer>


<script>

const SUBJECTS = {

    physics: "⚛ Physics",

    chemistry: "🧪 Chemistry",

    biology: "🧬 Biology",

    mathematics: "📐 Mathematics"

};


let state = {

    subject: null,

    chapter: null,

    topic: null,

    data: null

};


const app = document.getElementById("app");

const search = document.getElementById("search");


async function loadJSON(url) {

    const response = await fetch(
        url + "?v=" + Date.now()
    );

    if (!response.ok) {

        throw new Error(
            "Unable to load: " + url
        );

    }

    return await response.json();

}


/* =========================
   HOME
========================= */

function showHome() {

    state = {
        subject: null,
        chapter: null,
        topic: null,
        data: null
    };

    app.innerHTML = `

        <div class="home-title">

            <h1>
                📚 PCBM V2
            </h1>

            <p>
                Complete NEET Study Material
            </p>

        </div>

        <div class="subjects">

            ${Object.entries(SUBJECTS)
                .map(([key, name]) => `

                    <button
                        class="subject"
                        onclick="loadSubject('${key}')"
                    >

                        ${name}

                    </button>

                `)
                .join("")}

        </div>

    `;

}


/* =========================
   LOAD SUBJECT
========================= */

async function loadSubject(subject) {

    try {

        state.subject = subject;

        app.innerHTML = `
            <div class="loading">
                Loading ${SUBJECTS[subject]}...
            </div>
        `;

        const chapters =
            await loadJSON(
                `data/${subject}/chapters.json`
            );


        app.innerHTML = `

            <button
                class="back-button"
                onclick="showHome()"
            >
                ← Home
            </button>

            <h1>
                ${SUBJECTS[subject]}
            </h1>

            <p>
                Select a chapter
            </p>

            <div class="chapter-grid">

                ${chapters.map((chapter, index) => `

                    <div
                        class="chapter"
                        onclick="
                            loadChapter(
                                '${subject}',
                                '${chapter.id}'
                            )
                        "
                    >

                        <h3>
                            ${index + 1}.
                            ${chapter.name}
                        </h3>

                        <p>
                            ${chapter.subchapters || 0}
                            subchapters
                        </p>

                    </div>

                `).join("")}

            </div>

        `;

    }

    catch(error) {

        showError(error);

    }

}


/* =========================
   LOAD CHAPTER
========================= */

async function loadChapter(subject, chapterId) {

    try {

        app.innerHTML = `
            <div class="loading">
                Loading chapter...
            </div>
        `;


        const data =
            await loadJSON(
                `data/${subject}/${chapterId}.json`
            );


        state.subject = subject;

        state.chapter = chapterId;

        state.data = data;


        const topics =
            Array.isArray(data.subchapters)
            ? data.subchapters
            : [];


        app.innerHTML = `

            <button
                class="back-button"
                onclick="loadSubject('${subject}')"
            >
                ← Chapters
            </button>

            <h1>
                ${escapeHTML(data.name || chapterId)}
            </h1>

            <p>
                Select a subchapter
            </p>

            <div class="topic-grid">

                ${topics.map((topic, index) => `

                    <div
                        class="topic"
                        onclick="loadTopic(${index})"
                    >

                        <b>
                            ${index + 1}.
                            ${escapeHTML(topic.title || "Topic")}
                        </b>

                        <br>

                        <small>
                            Theory • Formula •
                            Derivation • Example •
                            Graph • Diagram •
                            MCQ • Revision
                        </small>

                    </div>

                `).join("")}

            </div>

        `;

    }

    catch(error) {

        showError(error);

    }

}


/* =========================
   LOAD TOPIC
========================= */

function loadTopic(index) {

    state.topic = index;

    const topic =
        state.data.subchapters[index];


    app.innerHTML = `

        <button
            class="back-button"
            onclick="
                loadChapter(
                    state.subject,
                    state.chapter
                )
            "
        >
            ← Subchapters
        </button>

        <h1>
            ${escapeHTML(topic.title)}
        </h1>


        <div class="tabs">

            <button onclick="renderTab('Theory')">
                📖 Theory
            </button>

            <button onclick="renderTab('Key Points')">
                📌 Key Points
            </button>

            <button onclick="renderTab('Formula')">
                📐 Formula
            </button>

            <button onclick="renderTab('Derivation')">
                🧮 Derivation
            </button>

            <button onclick="renderTab('Examples')">
                💡 Examples
            </button>

            <button onclick="renderTab('Graph')">
                📊 Graph
            </button>

            <button onclick="renderTab('Diagram')">
                🖼 Diagram
            </button>

            <button onclick="renderTab('MCQ')">
                ❓ MCQ
            </button>

            <button onclick="renderTab('Quick Revision')">
                ⚡ Quick Revision
            </button>

        </div>


        <div
            id="content"
            class="content"
        ></div>

    `;


    renderTab("Theory");

}


/* =========================
   RENDER CONTENT
========================= */

function renderTab(tab) {

    const topic =
        state.data.subchapters[state.topic];

    const content =
        document.getElementById("content");


    /* THEORY */

    if (tab === "Theory") {

        content.innerHTML = `

            <h2>📖 Theory</h2>

            <p>
                ${formatText(
                    topic.theory ||
                    "Study material is not available yet."
                )}
            </p>

        `;

    }


    /* KEY POINTS */

    else if (tab === "Key Points") {

        content.innerHTML = `

            <h2>📌 Key Points</h2>

            ${
                createList(
                    topic.key_points
                )
            }

        `;

    }


    /* FORMULA */

    else if (tab === "Formula") {

        const formulas =
            topic.formulas || [];


        content.innerHTML = `

            <h2>📐 Formula Sheet</h2>

            ${
                formulas.length
                ?
                formulas.map(formula => `

                    <div class="formula">

                        <b>
                            ${escapeHTML(
                                formula.name || "Formula"
                            )}
                        </b>

                        <div class="formula-text">

                            ${escapeHTML(
                                formula.formula || ""
                            )}

                        </div>

                        <small>

                            Unit:
                            ${escapeHTML(
                                formula.unit || "-"
                            )}

                        </small>

                    </div>

                `).join("")
                :
                "<p>No formulas added yet.</p>"
            }

        `;

    }


    /* DERIVATION */

    else if (tab === "Derivation") {

        const derivations =
            topic.derivations || [];


        content.innerHTML = `

            <h2>🧮 Derivation</h2>

            ${
                derivations.length
                ?
                derivations.map((step, i) => `

                    <div class="derivation">

                        <b>
                            Step ${i + 1}
                        </b>

                        <p>
                            ${formatText(step)}
                        </p>

                    </div>

                `).join("")
                :
                `
                <p>
                    No derivation has been added
                    to this topic yet.
                </p>
                `
            }

        `;

    }


    /* EXAMPLES */

    else if (tab === "Examples") {

        const examples =
            topic.examples || [];


        content.innerHTML = `

            <h2>💡 Solved Examples</h2>

            ${
                examples.length
                ?
                examples.map(example => `

                    <div class="example">

                        <h3>
                            ${escapeHTML(
                                example.question || ""
                            )}
                        </h3>

                        <p>
                            ${formatText(
                                example.solution || ""
                            )}
                        </p>

                    </div>

                `).join("")
                :
                "<p>No solved examples available.</p>"
            }

        `;

    }


    /* GRAPH */

    else if (tab === "Graph") {

        const path =
            normaliseAssetPath(topic.graph);


        content.innerHTML = `

            <h2>📊 Graph</h2>

            ${
                path
                ?
                `
                <img
                    class="visual"
                    src="${path}"
                    alt="Physics graph"
                    onerror="
                        this.parentElement.innerHTML =
                        '<div class=error>Graph file not found:<br>${path}</div>'
                    "
                >
                `
                :
                `
                <div class="error">
                    No graph assigned to this topic.
                </div>
                `
            }

        `;

    }


    /* DIAGRAM */

    else if (tab === "Diagram") {

        const path =
            normaliseAssetPath(topic.diagram);


        content.innerHTML = `

            <h2>🖼 Diagram</h2>

            ${
                path
                ?
                `
                <img
                    class="visual"
                    src="${path}"
                    alt="Physics diagram"
                    onerror="
                        this.parentElement.innerHTML =
                        '<div class=error>Diagram file not found:<br>${path}</div>'
                    "
                >
                `
                :
                `
                <div class="error">
                    No diagram assigned to this topic.
                </div>
                `
            }

        `;

    }


    /* MCQ */

    else if (tab === "MCQ") {

        const questions =
            topic.mcqs || [];


        content.innerHTML = `

            <h2>❓ NEET MCQs</h2>

            ${
                questions.length
                ?
                questions.map(
                    (question, qIndex) =>
                        createMCQ(question, qIndex)
                ).join("")
                :
                "<p>No MCQs available.</p>"
            }

        `;

    }


    /* QUICK REVISION */

    else if (tab === "Quick Revision") {

        const revision =
            topic.revision ||
            topic.quick_revision ||
            [];


        content.innerHTML = `

            <h2>⚡ Quick Revision</h2>

            ${
                createList(revision)
            }

        `;

    }

}


/* =========================
   MCQ
========================= */

function createMCQ(question, qIndex) {

    const questionText =
        question.q ||
        question.question ||
        "Question";


    const options =
        question.options || [];


    const answer =
        Number.isInteger(question.answer)
        ? question.answer
        : 0;


    return `

        <div
            class="mcq"
            id="mcq-${qIndex}"
        >

            <h3>
                Q${qIndex + 1}.
                ${escapeHTML(questionText)}
            </h3>


            ${options.map((option, index) => `

                <button
                    class="option"
                    onclick="
                        checkMCQ(
                            ${qIndex},
                            ${index},
                            ${answer}
                        )
                    "
                >

                    ${String.fromCharCode(65 + index)}.
                    ${escapeHTML(option)}

                </button>

            `).join("")}


            <div
                id="answer-${qIndex}"
            ></div>

        </div>

    `;

}


/* =========================
   CHECK MCQ
========================= */

function checkMCQ(
    questionIndex,
    selected,
    correct
) {

    const question =
        state.data.subchapters[state.topic]
        .mcqs[questionIndex];


    const answerBox =
        document.getElementById(
            `answer-${questionIndex}`
        );


    if (selected === correct) {

        answerBox.innerHTML = `

            <div class="answer">

                ✅ <b>Correct!</b>

                <br><br>

                ${
                    escapeHTML(
                        question.explanation || ""
                    )
                }

            </div>

        `;

    }

    else {

        answerBox.innerHTML = `

            <div class="answer">

                ❌ <b>Incorrect</b>

                <br>

                Correct answer:
                <b>
                    ${String.fromCharCode(65 + correct)}
                </b>

                <br><br>

                ${
                    escapeHTML(
                        question.explanation || ""
                    )
                }

            </div>

        `;

    }

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
    "input",
    async function(event) {

        const query =
            event.target.value
            .trim()
            .toLowerCase();


        if (!query) {

            showHome();

            return;

        }


        const results = [];


        for (
            const subject of Object.keys(SUBJECTS)
        ) {

            try {

                const chapters =
                    await loadJSON(
                        `data/${subject}/chapters.json`
                    );


                chapters.forEach(chapter => {

                    if (
                        chapter.name
                        .toLowerCase()
                        .includes(query)
                    ) {

                        results.push({
                            subject,
                            chapter
                        });

                    }

                });

            }

            catch(error) {

                console.error(error);

            }

        }


        app.innerHTML = `

            <button
                class="back-button"
                onclick="showHome()"
            >
                ← Home
            </button>

            <h1>
                🔎 Search Results
            </h1>

            ${
                results.length
                ?
                `
                <div class="chapter-grid">

                    ${results.map(result => `

                        <div
                            class="chapter"
                            onclick="
                                loadChapter(
                                    '${result.subject}',
                                    '${result.chapter.id}'
                                )
                            "
                        >

                            <b>
                                ${SUBJECTS[result.subject]}
                            </b>

                            <h3>
                                ${escapeHTML(
                                    result.chapter.name
                                )}
                            </h3>

                        </div>

                    `).join("")}

                </div>
                `
                :
                `
                <p>
                    No chapter found.
                </p>
                `
            }

        `;

    }
);


/* =========================
   HELPERS
========================= */

function createList(items) {

    if (!Array.isArray(items) || items.length === 0) {

        return "<p>No information available.</p>";

    }


    return `

        <ul>

            ${items.map(item => `

                <li>
                    ${formatText(item)}
                </li>

            `).join("")}

        </ul>

    `;

}


function formatText(text) {

    if (text === undefined || text === null) {

        return "";

    }

    return escapeHTML(
        String(text)
    )
    .replace(/\n/g, "<br>");

}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function normaliseAssetPath(path) {

    if (!path) return "";

    path = String(path).replace(/\\/g, "/");

    if (path.startsWith("http://") ||
        path.startsWith("https://")) {

        return path;

    }

    path = path.replace(/^\.?\//, "");

    return path;

}


function showError(error) {

    console.error(error);

    app.innerHTML = `

        <div class="error">

            <h2>
                ⚠️ Unable to load content
            </h2>

            <p>
                ${escapeHTML(error.message)}
            </p>

            <p>
                Check that the JSON file exists
                inside the repository.
            </p>

            <button
                class="back-button"
                onclick="showHome()"
            >
                ← Return Home
            </button>

        </div>

    `;

}


/* =========================
   START APPLICATION
========================= */

showHome();

</script>

</body>
</html>
