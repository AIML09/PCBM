<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PCBM Learning Portal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#102a43,#17365d,#28598f);
    color:white;
    padding:35px 20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:38px;
}

header p{
    font-size:18px;
    margin:10px 0 0;
}

.container{
    max-width:1150px;
    margin:30px auto;
    padding:20px;
}

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.subject-grid,
.chapter-grid,
.mode-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 22px rgba(0,0,0,.16);
}

.subject-icon{
    font-size:55px;
}

.card h2{
    margin:12px 0;
}

.card p{
    color:#666;
    line-height:1.5;
}

.physics{
    border-top:5px solid #1976d2;
}

.chemistry{
    border-top:5px solid #e53935;
}

.biology{
    border-top:5px solid #43a047;
}

.maths{
    border-top:5px solid #8e24aa;
}

.chapter-card{
    text-align:left;
}

.chapter-number{
    display:inline-block;
    background:#17365d;
    color:white;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
}

.mode-card{
    text-align:center;
}

.mode-icon{
    font-size:40px;
}

.content-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    line-height:1.7;
}

.content-box h2{
    color:#17365d;
}

.content-box h3{
    color:#28598f;
}

.content-box li{
    margin:8px 0;
}

.formula{
    background:#eef5ff;
    padding:15px;
    margin:10px 0;
    border-left:5px solid #1976d2;
    border-radius:8px;
    font-weight:bold;
}

.question{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
    margin-bottom:20px;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    margin:10px 0;
    padding:14px;
    background:#f1f4f8;
    border:2px solid transparent;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.option:hover{
    border-color:#28598f;
    background:#eaf2fb;
}

.correct{
    background:#d4edda !important;
    border-color:#28a745 !important;
}

.wrong{
    background:#f8d7da !important;
    border-color:#dc3545 !important;
}

.answer-box{
    margin-top:15px;
    padding:15px;
    border-radius:8px;
    background:#eef5ff;
}

button{
    background:#17365d;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin:5px;
}

button:hover{
    background:#28598f;
}

.back{
    text-align:center;
    margin:25px 0;
}

.search-box{
    width:100%;
    padding:15px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
    margin-bottom:25px;
}

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    justify-content:center;
    margin:25px 0;
}

.stat{
    background:white;
    padding:15px 25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    text-align:center;
}

.stat strong{
    display:block;
    font-size:25px;
    color:#17365d;
}

footer{
    background:#17365d;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:50px;
}

.hidden{
    display:none;
}

@media(max-width:600px){

    header h1{
        font-size:30px;
    }

    .container{
        padding:12px;
    }

    .card{
        padding:20px;
    }

    .content-box{
        padding:20px;
    }
}
</style>
</head>

<body>

    <h1>📚 PCBM Learning Portal</h1>

<div class="container" id="app"></div>

let currentSubject = "";

/* =========================================================

========================================================= */

function showHome(){

/* =========================================================
   SUBJECT PAGE
========================================================= */

function showSubject(subject){

    currentSubject = subject;

    const data = subjects[subject];

    document.getElementById("app").innerHTML = `

        <div class="page-title">

            <h2>
                ${data.icon} ${subject}
            </h2>

            <p>${data.description}</p>

        </div>

        <input
            class="search-box"
            id="chapterSearch"
            placeholder="🔍 Search chapter..."
            oninput="filterChapters()"
        >

        <div class="chapter-grid" id="chapterGrid">

            ${data.chapters.map((chapter,index)=>`

                <div
                    class="card chapter-card"
                    data-name="${chapter.toLowerCase()}"
                    onclick="showChapter('${escapeQuotes(chapter)}')">

                    <span class="chapter-number">
                        Chapter ${index+1}
                    </span>

                    <h2>${chapter}</h2>

                    <p>
                        📖 Theory &nbsp;
                        ❓ MCQ &nbsp;
                        📌 Notes
                    </p>

                </div>

            `).join("")}

        </div>

        <div class="back">

            <button onclick="showHome()">
                ← Back to Subjects
            </button>

        </div>
    `;
}


/* =========================================================
   SEARCH
========================================================= */

function filterChapters(){

    const search =
        document.getElementById("chapterSearch")
        .value
        .toLowerCase();

    document.querySelectorAll(".chapter-card")
        .forEach(card=>{

            card.style.display =
                card.dataset.name.includes(search)
                ? "block"
                : "none";

        });
}


/* =========================================================
   CHAPTER PAGE
========================================================= */

function showChapter(chapter){

    currentChapter = chapter;

    const data = subjects[currentSubject];

    document.getElementById("app").innerHTML = `

            </h2>

            <p>
                ${currentSubject} • Chapter Study Center
            </p>

                 onclick="showTheory()">

                    Learn the important concepts

                </p>

            </div>


            <div class="card mode-card"
                 onclick="showImportant()">

            </div>

            </div>

            <div class="formula">
                Genotype → Phenotype
            </div>

            <div class="formula">
                DNA → RNA → Protein
            </div>

        `;
    }

    document.getElementById("app").innerHTML = `

        <div class="content-box">

            <h2>
                📐 ${currentChapter}
            </h2>

            <h3>Important Formula / Reaction Sheet</h3>

            ${content}

            <p>
                💡 More chapter-specific formulas can be

            </p>

        </div>

    `;

/* =========================================================

========================================================= */

/* =========================================================
   MCQ
========================================================= */

function showMCQ(){

    let question = getMCQ(currentSubject,currentChapter);

    document.getElementById("app").innerHTML = `

        <div class="question">

            <h2>
                ❓ ${currentChapter} — MCQ
            </h2>

            <h3>${question.q}</h3>

            ${question.options.map((option,index)=>`

                <button
                    class="option"
                    onclick="checkMCQ(this,${index},${question.answer})">

                    ${String.fromCharCode(65+index)}.
                    ${option}

                </button>

            `).join("")}

            <div id="answerBox"></div>

        </div>

        ${backToChapter()}
    `;
}


/* =========================================================
   SAMPLE MCQ DATABASE
========================================================= */

function getMCQ(subject,chapter){

    if(subject === "Physics"){

        return {
            q:"A body has initial velocity 10 m/s and acceleration 2 m/s². What is its velocity after 5 seconds?",
            options:[
                "15 m/s",
                "20 m/s",
                "25 m/s",
                "30 m/s"
            ],
            answer:1
        };

    }

    if(subject === "Chemistry"){

        return {
            q:"What is the SI unit of amount of substance?",
            options:[
                "Gram",
                "Kilogram",
                "Mole",
                "Litre"
            ],
            answer:2
        };

    }

    if(subject === "Biology"){

        return {
            q:"The basic structural and functional unit of life is:",
            options:[
                "Tissue",
                "Cell",
                "Organ",
                "Organ system"
            ],
            answer:1
        };

    }

    return {
        q:"What is the derivative of x²?",
        options:[
            "x",
            "2x",
            "x²",
            "2"
        ],
        answer:1
    };
}


/* =========================================================
   CHECK MCQ
========================================================= */

function checkMCQ(button,selected,correct){

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(b=>{
        b.disabled=true;
    });

    if(selected === correct){

        button.classList.add("correct");

        document.getElementById("answerBox").innerHTML = `

            <div class="answer-box">

                <strong>✅ Correct!</strong>

                <p>
                    Excellent. You selected the correct answer.
                </p>

            </div>

        `;

    }
    else{

        button.classList.add("wrong");

        buttons[correct].classList.add("correct");

        document.getElementById("answerBox").innerHTML = `

            <div class="answer-box">

                <strong>❌ Incorrect</strong>

                <p>
                    The correct answer is
                    <strong>
                        ${buttons[correct].innerText}
                    </strong>.
                </p>

            </div>

        `;
    }
}


/* =========================================================
   CONCEPT TRAPS
========================================================= */

function showConceptTrap(){

    document.getElementById("app").innerHTML = `

        <div class="content-box">

            <h2>
                🧠 ${currentChapter} — Concept Traps

            <h3>⚠️ Common Mistakes</h3>

                <li>Always check units in numerical questions.</li>
                <li>Read every option carefully in MCQs.</li>
                <li>Do not ignore negative signs.</li>
                <li>Revise exceptions separately.</li>
                <li>Understand diagrams and graphs where applicable.</li>
            </ul>

            <h3>🎯 Exam Tip</h3>

            <p>
                Questions often test concepts rather than
                direct memorization. Focus on understanding
                why an answer is correct.
            </p>

    `;
}


/* =========================================================
   TEST
========================================================= */

function showTest(){

    document.getElementById("app").innerHTML = `

        <div class="question">

            <h2>
                🎯 ${currentChapter} — Chapter Test
            </h2>

            <p>
                Test mode will contain multiple questions

            </p>

            <hr>

            <h3>
                Question 1
            </h3>

            <p>
                Which is the best approach when solving a
                chapter-based question?
            </p>

            <button class="option"
                onclick="testAnswer(this,true)">
                A. Guess immediately
            </button>

            <button class="option"
                onclick="testAnswer(this,false)">
                B. Identify the concept first
            </button>

            <button class="option"
                onclick="testAnswer(this,false)">
                C. Skip all information
            </button>

            <button class="option"
                onclick="testAnswer(this,false)">
                D. Ignore units
            </button>

            <div id="testResult"></div>

        </div>

        ${backToChapter()}
    `;
}


/* =========================================================
   TEST ANSWER
========================================================= */

function testAnswer(button,correct){

    const options =
        document.querySelectorAll(".option");

    options.forEach(b=>{
        b.disabled=true;
    });

    if(correct){

        button.classList.add("correct");

        document.getElementById("testResult").innerHTML = `

            <div class="answer-box">
                ✅ Correct!
            </div>

        `;

    }else{

        button.classList.add("wrong");

        document.getElementById("testResult").innerHTML = `

            <div class="answer-box">
                ❌ Incorrect. Review the chapter concepts.
            </div>

        `;
    }
}


/* =========================================================
   BACK BUTTON
========================================================= */

function backToChapter(){

    return `

        <div class="back">

            <button onclick="showChapter(currentChapter)">
                ← Back to Chapter
            </button>

            <button onclick="showSubject(currentSubject)">
                ← Back to Chapters
            </button>

        </div>

    `;
}


/* =========================================================
   ESCAPE QUOTES
========================================================= */

function escapeQuotes(text){

    return text
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* =========================================================
   START APP
========================================================= */

showHome();

</script>
