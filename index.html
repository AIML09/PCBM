function organicTheory(){

return `

<h3>1. What is Organic Chemistry?</h3>

<p>
Organic chemistry is the branch of chemistry that deals mainly
with carbon-containing compounds. Carbon forms a very large
number of compounds because of its tetravalency and ability to
form strong covalent bonds with itself.
</p>

<h3>2. Why Carbon Forms So Many Compounds</h3>

<ul>
<li><strong>Tetravalency:</strong> Carbon has four valence electrons and forms four covalent bonds.</li>
<li><strong>Catenation:</strong> Carbon atoms can bond with other carbon atoms to form chains and rings.</li>
<li><strong>Multiple bonds:</strong> Carbon can form C–C, C=C and C≡C bonds.</li>
<li><strong>Strong bonds:</strong> C–C and C–H bonds are relatively strong.</li>
</ul>

<h3>3. Classification of Organic Compounds</h3>

<ul>
<li><strong>Acyclic compounds:</strong> Open-chain compounds.</li>
<li><strong>Homocyclic compounds:</strong> Rings containing only carbon atoms.</li>
<li><strong>Heterocyclic compounds:</strong> Rings containing carbon and other atoms such as N, O or S.</li>
<li><strong>Aromatic compounds:</strong> Compounds containing aromatic ring systems such as benzene.</li>
</ul>

<h3>4. Functional Groups</h3>

<p>
A functional group is an atom or group of atoms responsible for
the characteristic chemical reactions of an organic compound.
</p>

<div class="formula">
–OH → Alcohol
</div>

<div class="formula">
–CHO → Aldehyde
</div>

<div class="formula">
&gt;C=O → Ketone
</div>

<div class="formula">
–COOH → Carboxylic acid
</div>

<div class="formula">
–NH₂ → Amine
</div>

<div class="formula">
–X → Halo compound
</div>

<h3>5. Homologous Series</h3>

<p>
A homologous series is a family of organic compounds having the
same functional group and general formula. Successive members
differ by a <strong>–CH₂–</strong> unit.
</p>

<p>
Example:
CH₄, C₂H₆, C₃H₈, C₄H₁₀
</p>

<h3>6. IUPAC Nomenclature</h3>

<ol>
<li>Select the longest carbon chain.</li>
<li>Number the chain from the end giving the lowest locant to the principal functional group.</li>
<li>Identify substituents.</li>
<li>Assign their positions.</li>
<li>Arrange substituent names alphabetically.</li>
<li>Write the complete IUPAC name.</li>
</ol>

<h3>7. Isomerism</h3>

<p>
Isomers are compounds having the same molecular formula but
different structures or spatial arrangements.
</p>

<ul>
<li>Chain isomerism</li>
<li>Position isomerism</li>
<li>Functional isomerism</li>
<li>Metamerism</li>
<li>Geometrical isomerism</li>
<li>Optical isomerism</li>
</ul>

<h3>8. Electronic Effects</h3>

<p>
Electronic effects explain how electrons are distributed within
an organic molecule.
</p>

<h4>Inductive Effect</h4>

<p>
Permanent displacement of sigma electrons due to electronegativity
differences.
</p>

<div class="formula">
–I groups: –NO₂, –CN, –COOH, –F, –Cl
</div>

<div class="formula">
+I groups: Alkyl groups such as –CH₃, –C₂H₅
</div>

<h4>Resonance</h4>

<p>
Resonance occurs when a molecule can be represented by two or
more contributing structures differing only in electron
distribution.
</p>

<h4>Hyperconjugation</h4>

<p>
Hyperconjugation involves delocalisation of electrons of a
sigma bond, commonly a C–H bond adjacent to a double bond or
positively charged carbon.
</p>

<h3>9. Electromeric Effect</h3>

<p>
The electromeric effect is a temporary complete transfer of
pi electrons of a multiple bond under the influence of an
attacking reagent.
</p>

<h3>10. Reaction Intermediates</h3>

<h4>Carbocation</h4>

<p>
A carbocation contains a positively charged carbon atom.
</p>

<div class="formula">
Stability: 3° &gt; 2° &gt; 1° &gt; CH₃⁺
</div>

<h4>Carbanion</h4>

<p>
A carbanion contains a negatively charged carbon atom.
</p>

<div class="formula">
Generally: CH₃⁻ &gt; 1° &gt; 2° &gt; 3°
</div>

<h4>Free Radical</h4>

<p>
A free radical contains an unpaired electron.
</p>

<div class="formula">
Stability: 3° &gt; 2° &gt; 1° &gt; CH₃•
</div>

<h3>11. Nucleophiles</h3>

<p>
A nucleophile is an electron-rich species that attacks an
electron-deficient centre.
</p>

<p>
Examples: OH⁻, CN⁻, NH₃, H₂O.
</p>

<h3>12. Electrophiles</h3>

<p>
An electrophile is an electron-deficient species that accepts
an electron pair.
</p>

<p>
Examples: H⁺, NO₂⁺ and carbocations.
</p>

<h3>13. Types of Organic Reactions</h3>

<ul>
<li><strong>Substitution:</strong> One atom/group is replaced by another.</li>
<li><strong>Addition:</strong> Atoms/groups add across a multiple bond.</li>
<li><strong>Elimination:</strong> Atoms/groups are removed to form a multiple bond.</li>
<li><strong>Rearrangement:</strong> Atoms/groups change their positions within a molecule.</li>
<li><strong>Oxidation:</strong> Usually involves increase in oxygen or decrease in hydrogen.</li>
<li><strong>Reduction:</strong> Usually involves increase in hydrogen or decrease in oxygen.</li>
</ul>

<h3>14. Purification Techniques</h3>

<ul>
<li>Crystallisation</li>
<li>Sublimation</li>
<li>Distillation</li>
<li>Fractional distillation</li>
<li>Steam distillation</li>
<li>Chromatography</li>
</ul>

<h3>15. Qualitative Analysis</h3>

<p>
Organic compounds can be tested for elements such as nitrogen,
sulphur and halogens using appropriate chemical tests.
</p>

<h3>⭐ Key Takeaway</h3>

<p>
For Organic Chemistry, first master <strong>GOC</strong>:
electronic effects, resonance, acidity/basicity, reaction
intermediates, nucleophiles, electrophiles and reaction
mechanisms. These concepts are used repeatedly in later
organic chapters.
</p>

`;
}
